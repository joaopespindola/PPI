<!DOCTYPE html>
<html>

<head>
  <title>Desenvolvimento Web com Ajax</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-CuOF+2SnTUfTwSZjCXf01h7uYhfOBuxIhGKPbfEJ3+FqH/s6cIFN9bGr1HmAg4fQ" crossorigin="anonymous">
  <style>
    body {
      padding-top: 2rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h3>Preenchendo o endereço com Ajax</h3>
  
    <form class="row g-3">
      <div>
        <label for="cep" class="form-label">Informe o CEP no formato xxxxx-xxx (Ex. 38400-100, 38400-200)</label>
        <input type="text" class="form-control" id="cep" name="cep">
      </div>
      <div>
        <label for="rua" class="form-label">Rua:</label>
        <input type="text" class="form-control" id="rua" name="rua">
      </div>
      <div>
        <label for="bairro" class="form-label">Bairro:</label>
        <input type="text" class="form-control" id="bairro" name="bairro">
      </div>
      <div>
        <label for="cidade" class="form-label">Cidade:</label>
        <input type="text" class="form-control" id="cidade" name="cidade">
      </div>
    </form>
  
  </div>

  <script>

    function buscaEndereco(cep) {
      if (cep.length != 9)// Não segue se o cep tiver menos de 9 dígitos
        return;

      let xhr = new XMLHttpRequest();
      xhr.open("GET", "busca-endereco.php?cep=" + cep);// // Define o método HTTP, e o parâmetro que será passado na URL ao chamar "busca-cidade.php" concatenado com o 
      // CEP informado pelo usuário na página HTML
      xhr.responseType = 'json';// Seta o tipo da resposta como "json"

      xhr.onload = function () {
        // Se retornar um status diferente de 200 ou a resposta for null
        if (xhr.status != 200 || xhr.response === null) {
          console.log("A resposta não pode ser obtida ");// Exibe uma mensagem de erro
          console.log(xhr.status);// Exibe o status da requisição
          return;
        }

        const endereco = xhr.response;// Recebe o conteúdo da resposta na constante "endereco"
        let form = document.querySelector("form");// Seleciona o formulário
        // Atribui os valores de acordo com os informados pelo usuário
        form.rua.value = endereco.rua;
        form.bairro.value = endereco.bairro;
        form.cidade.value = endereco.cidade;
      }

      // Caso haja um erro na requisição
      xhr.onerror = function () {
        console.error("Erro de rede - requisição não finalizada");
      };

      xhr.send();// Envia a requisição
    }

    const inputCep = document.querySelector("#cep");// Seleciona o elemento de id "cep"
    inputCep.onkeyup = () => buscaEndereco(inputCep.value);// Executa a função "buscaEndereco" na ação "onKeyUp" passando como parâmetro o valor informado pelo usuário
  </script>

</body>

</html>
