<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Teste Ajax - onerror</title>
  <style>
    body {
      font: 1.2rem Helvetica;
      line-height: 1.5rem;
      background-image: url("images/bg2.jpg");
      background-size: cover;
      margin: 0;
    }

    main {
      width: 60%;
      background-color: #fff;
      border: 0.5px solid #ccc;
      margin: 0;
      padding: 2% 4%;

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>

  <main>
    <label for="cep">Informe o CEP (38400-100 ou 38700-000)</label>
    <input type="text" id="cep">
    <span id="cidade"><span>
  </main>

  <script>
    function buscaCidade(cep) {
      if (cep.length != 9)// Não segue se o CEP tiver menos de 9 digitos
        return;

      let xhr = new XMLHttpRequest();// Instância do objeto XMLHttpRequest
      xhr.open("GET", "busca-cidade.php?cep=" + cep);// Define o método HTTP, e o parâmetro que será passado na URL ao chamar "busca-cidade.php" concatenado com o 
      // CEP informado pelo usuário na página HTML

      xhr.onload = function () {
        if (xhr.status == 200)// Se retornar um status 200 (requisição bem sucedida)
          document.getElementById("cidade").textContent = xhr.responseText;// Seleciona o elemento cujo id é "cidade" e atribui o conteúdo informado pelo servidor
        else {
          document.getElementById("cidade").textContent = "";// Se retornar um status diferente de 200 (requisição mal sucedida), limpa o conteúdo
          console.log(xhr.status, xhr.statusText, xhr.responseText);// Exibe os dados retornados pelo servidor
        }
      };

      // Em caso de erro na REQUISIÇÃO
      xhr.onerror = function () {
        console.log("Erro de rede");
      };

      xhr.send();// Envia a requisição
    }

    const inputCep = document.querySelector("#cep");// Seleciona o elemento de id "cep"
    inputCep.onkeyup = () => buscaCidade(inputCep.value);// Executa a função "buscaCidade" na ação "onKeyUp" passando como parâmetro o valor informado pelo usuário
  </script>

</body>

</html>
