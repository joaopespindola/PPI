<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajax</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-CuOF+2SnTUfTwSZjCXf01h7uYhfOBuxIhGKPbfEJ3+FqH/s6cIFN9bGr1HmAg4fQ" crossorigin="anonymous">

  <style>
    html {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-image: url("images/bg2.jpg");
      background-repeat: no-repeat;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .container {
      position: relative;
      height: 100vh;
    }

    main {
      padding: 2rem;
      padding-top: 2rem;
      width: 60%;
      border: 0.5px solid lightgray;
      border-radius: 5px;
      background-color: #fff;
      box-shadow: 5px 5px 5px gray;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    form {
      margin-bottom: 2rem;
    }

    main>h3 {
      text-align: center;
      color: blue;
      margin-bottom: 2rem;
    }

    #loginFailMsg {
      color: red;
      text-align: center;
    }

    .hide {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <main>
      <h3>Exemplo de Login Simples</h3>
      <form name="formLogin" class="row g-3">
        <div class="col-sm-12">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" id="email">
        </div>
        <div class="col-sm-12">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" name="senha" class="form-control" id="senha">
        </div>
        <div class="col-sm-12 d-grid">
          <button class="btn btn-primary btn-block">Entrar</button>
        </div>
        <div class="col-sm-12 d-grid">
          <p id="loginFailMsg" class="hide"></p>
        </div>
      </form>
    </main>
  </div>

  <script>

    async function sendForm(form) {

      try {
        // Faz o envio do formulário para "login.php", pelo método POST, é criado um objeto FormData com o 
        //"form" para enviar os dados do formulário para o servidor por meio de uma requisição Ajax com await
        // para que a thread aguarde o retorno da promessa.
        const response = await fetch("login.php", { method: 'post', body: new FormData(form) });
        if (!response.ok) throw new Error(response.statusText);// Em caso de erro, lança uma exceção com o "statusText" da response
        const loginResult = await response.json();// Converte o corpo da resposta em um objeto JavaScript

        // Verifica se o login foi bem-sucedido
        if (loginResult.success)
          window.location = loginResult.newLocation;// Caso o login tenha sido efetuado com sucesso, redireciona para a página inicial "home.php"
        else {
          // Se o login não foi efetuado com sucesso por credenciais erradas exibe uma mensagem de erro
          const parLoginFailMsg = document.querySelector("#loginFailMsg");
          parLoginFailMsg.textContent = 'Dados incorretos. Por favor, tente novamente.';
          parLoginFailMsg.classList.remove('hide');// Exibe a mensagem de erro
          form.senha.value = "";// Limpa o campo de senha
          form.senha.focus();// Posiciona o foco no campo de senha
        }
      }
      catch (e) {
        const parLoginFailMsg = document.querySelector("#loginFailMsg");// Se o login não foi efetuado com sucesso por outro motivo
        // como erros relacionado a problema de conexão ou no servidor, exibe uma mensagem de erro
        parLoginFailMsg.textContent = 'Falha inesperada. Entre em contato o administrador do sistema.';
        parLoginFailMsg.classList.remove('hide');// Exibe a mensagem de erro
      }
    }

    const meuForm = document.forms.formLogin;
    meuForm.onsubmit = function (e) {
      e.preventDefault();
      sendForm(meuForm);
    }

  </script>

</body>

</html>
