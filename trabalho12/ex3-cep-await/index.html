<!DOCTYPE html>
<html>

<head>
  <title>Desenvolvimento Web com Ajax</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-CuOF+2SnTUfTwSZjCXf01h7uYhfOBuxIhGKPbfEJ3+FqH/s6cIFN9bGr1HmAg4fQ" crossorigin="anonymous">
  <style>
    body {
      padding-top: 2rem;
    }

    h3 {
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h3>Preenchendo o endereço com Ajax</h3>

    <form class="row g-3">
      <div>
        <label for="cep" class="form-label">Informe o CEP no formato xxxxx-xxx (Ex. 38400-100)</label>
        <input type="text" class="form-control" id="cep" name="cep">
      </div>
      <div>
        <label for="rua" class="form-label">Rua:</label>
        <input type="text" class="form-control" id="rua" name="rua">
      </div>
      <div>
        <label for="bairro" class="form-label">Bairro:</label>
        <input type="text" class="form-control" id="bairro" name="bairro">
      </div>
      <div>
        <label for="cidade" class="form-label">Cidade:</label>
        <input type="text" class="form-control" id="cidade" name="cidade">
      </div>
    </form>

  </div>

  <script>

    async function buscaEndereco(cep) {
      // Verifica se o comprimento do CEP está correto (9 caracteres)
      if (cep.length != 9) return;

      try {
        // Realiza a requisição HTTP de forma assíncrona e aguarda a resposta
        const response = await fetch("busca-endereco-bd.php?cep=" + cep);

        // Verifica se a resposta da requisição foi bem-sucedida
        if (!response.ok) {
          // Se não foi bem-sucedida, aguarda a leitura do texto da resposta
          errorMessage = await response.text();
          // Lança um erro com a mensagem de status e o conteúdo da resposta
          throw new Error(response.statusText + errorMessage);
        }

        // Aguarda a conversão do corpo da resposta para um objeto JavaScript
        const endereco = await response.json();

        // Seleciona o formulário do DOM
        const form = document.querySelector("form");

        // Preenche os campos do formulário com os dados obtidos da resposta
        form.rua.value = endereco.logradouro; // Mudança de rua para logradouro para alinhar com o BD
        form.bairro.value = endereco.bairro;
        form.cidade.value = endereco.cidade;
      } catch (e) {
        // Captura qualquer erro que ocorra durante o processo
        console.error(e); // Exibe o erro no console para depuração
        return; // Sai da função se um erro ocorrer
      }
    }

    // O valor da variável "response.status" é 200.
    // o valor de "response.body" não contém diretamente os dados do endereço,
    // porque "response.body" é uma leitura da resposta em forma de fluxo.
    // Para acessar os dados do endereço, usamos "response.json()", que faz a leitura
    // do corpo da resposta e o converte em um objeto JavaScript. Portanto,
    // "response.body" não possui os dados do endereço de forma utilizável diretamente.


    window.onload = function () {
      const inputCep = document.querySelector("#cep");
      inputCep.onkeyup = () => buscaEndereco(inputCep.value);
    }

  </script>

</body>

</html>
