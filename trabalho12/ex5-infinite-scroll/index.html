<!DOCTYPE html>
<html>

<head>
  <title>Rolagem Infinita</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #dedede;
      font-family: Helvetica;
      width: 60%;
      margin: 0 auto;
      margin-top: 3rem;
    }

    h2 {
      font-size: 2.5rem;
      color: #888;
    }

    .item {
      background-color: white;
      padding: 1rem;
      margin: 1rem 0;
    }

    .item-image {
      width: 150px;
      height: 150px;
      margin: 0 2rem;
    }

    .item-name {
      font: 2em Verdana;
      color: #888;
    }

    .item-price {
      font: 2em Verdana;
      color: darkgreen;
      margin-left: 2rem;
    }

    .item-price::before {
      content: 'R$ ';
    }
  </style>
</head>

<body>

  <section id="products">
    <h2>Nossos produtos</h2>

    <!-- O contúdo de um <template> não é renderizado automaticamente na página, e não é visível
      diretamente por métodos como document.querySelector, pois ele é tratado como um 
      fragmento de documento (Document Fragment). Entretanto, podemos utilizar
      a propriedade 'content' para acessar seu conteúdo, cloná-lo com o método cloneNode e 
      inserí-lo na árvore DOM renderizada com appendChild -->
    <template id="item-template">
      <div class="item">
        <img class="item-image" alt="Imagem do produto"> <!-- Adicionei um atributo alt para acessibilidade -->
        <span class="item-name"></span>
        <span class="item-price"></span>
      </div>
    </template>

  </section>

  <script>

    // Função para renderizar os produtos na seção de produtos
    function renderProducts(newProducts) {
      const prodsSection = document.getElementById("products");
      // Veja observações sobre o elemento <template> no código HTML
      const divItemTemplate = document.getElementById("item-template").content.firstElementChild;
      for (let product of newProducts) {
        // Clona o item do template para criar um novo item
        const newItem = divItemTemplate.cloneNode(true);
        // Define a imagem do produto
        newItem.querySelector(".item-image").src = product.imagePath;
        // Define o nome do produto
        newItem.querySelector(".item-name").textContent = product.name;
        // Define o preço do produto
        newItem.querySelector(".item-price").textContent = product.price;
        // Adiciona o novo item à seção de produtos
        prodsSection.appendChild(newItem);
      }
    }

    // Função assíncrona para carregar produtos de um endpoint
    async function loadProducts() {
      try {
        // Realiza uma requisição para buscar produtos
        let response = await fetch("more-products.php");
        // Verifica se a resposta foi bem-sucedida
        if (!response.ok) throw new Error(response.statusText);
        // Converte a resposta em um objeto JSON
        var products = await response.json();
      }
      catch (e) {
        // Em caso de erro, exibe no console
        console.error(e);
        return; // Sai da função se ocorrer um erro
      }
      // Renderiza os produtos obtidos
      renderProducts(products);
    }

    // Carrega os produtos quando a página é carregada
    window.onload = function () {
      loadProducts();
    }

    // Carrega mais produtos quando o usuário rolar até o final da página
    window.onscroll = function () {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight) {
        loadProducts(); // Chama a função para carregar mais produtos
      }
    };

  </script>

</body>

</html>
